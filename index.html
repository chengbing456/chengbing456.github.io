<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🕯️ 超自然盗号器</title>
  <style>
        /* ===== 全局黑暗灵异风格 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a0a0a 0%, #0d0505 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 飘浮的鬼火粒子（纯装饰） */
        body::before,
        body::after {
            content: '✦';
            position: absolute;
            color: rgba(100, 200, 255, 0.08);
            font-size: 120px;
            animation: floatGhost 12s infinite alternate ease-in-out;
            pointer-events: none;
        }
        body::before { top: 5%; left: 3%; animation-delay: 0s; }
        body::after { bottom: 5%; right: 3%; animation-delay: 4s; font-size: 180px; }

        @keyframes floatGhost {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.3; }
            100% { transform: translate(40px, -60px) scale(1.6) rotate(30deg); opacity: 0.7; }
        }

        /* ===== 主卡片 ===== */
        .ritual-box {
            max-width: 520px;
            width: 100%;
            background: rgba(20, 8, 8, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(180, 80, 80, 0.25);
            border-radius: 48px 48px 32px 32px;
            padding: 40px 36px 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(200, 50, 50, 0.15);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: box-shadow 0.3s;
        }

        .ritual-box:hover {
            box-shadow: 0 20px 80px rgba(200, 50, 50, 0.25);
        }

        /* 标题区域 */
        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #e0c0b0;
            text-shadow: 0 0 20px rgba(255, 100, 80, 0.3), 0 0 60px rgba(200, 50, 0, 0.2);
            margin-bottom: 8px;
            word-break: break-word;
        }

        .subtitle {
            font-size: 13px;
            color: #9a7a7a;
            letter-spacing: 3px;
            border-top: 1px dashed #4a2a2a;
            border-bottom: 1px dashed #4a2a2a;
            padding: 10px 0;
            margin-bottom: 28px;
            font-style: italic;
        }

        .subtitle span {
            color: #cfa0a0;
            animation: flicker 2.4s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.4; text-shadow: 0 0 2px #ff6666; }
            100% { opacity: 1; text-shadow: 0 0 18px #ff4444; }
        }

        /* ===== 输入区 ===== */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #b09090;
            letter-spacing: 2px;
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .input-group label i {
            color: #d42a2a;
            font-style: normal;
            margin-right: 6px;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            background: rgba(10, 5, 5, 0.7);
            border: 1px solid #3a2020;
            border-radius: 40px;
            color: #eeddcc;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .input-field:focus {
            border-color: #a04a4a;
            background: rgba(20, 8, 8, 0.9);
            box-shadow: 0 0 24px rgba(200, 60, 60, 0.2);
        }

        .input-field::placeholder {
            color: #5a4040;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* ===== 神秘按钮 ===== */
        .ritual-btn {
            width: 100%;
            margin-top: 12px;
            padding: 16px;
            background: linear-gradient(145deg, #2a1212, #1a0808);
            border: 1px solid #6a3a3a;
            border-radius: 60px;
            color: #eacaca;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 6px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 0 #0a0303;
            font-family: 'Courier New', monospace;
            position: relative;
            overflow: hidden;
        }

        .ritual-btn:hover {
            background: linear-gradient(145deg, #3a1a1a, #220c0c);
            border-color: #9a4a4a;
            color: #fff0f0;
            box-shadow: 0 6px 0 #0a0303, 0 0 40px rgba(200, 50, 50, 0.3);
            transform: scale(1.01);
        }

        .ritual-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0a0303;
        }

        /* ===== 结果显示区（"盗号"反馈） ===== */
        .result-area {
            margin-top: 30px;
            padding: 16px 12px;
            min-height: 70px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 30px;
            border: 1px solid #2a1818;
            color: #bfa0a0;
            font-size: 14px;
            line-height: 1.6;
            transition: all 0.4s;
            position: relative;
        }

        .result-area .highlight {
            color: #ffb0a0;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 80, 80, 0.3);
            word-break: break-all;
        }

        .result-area .fake-password {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 16px;
            background: #1a0e0e;
            border-radius: 40px;
            border: 1px solid #4a2828;
            color: #d4b0b0;
            font-family: monospace;
            letter-spacing: 2px;
            font-size: 15px;
        }

        /* 脚注免责 */
        .disclaimer {
            margin-top: 24px;
            font-size: 11px;
            color: #4a3535;
            letter-spacing: 1px;
            border-top: 1px solid #1f1212;
            padding-top: 18px;
        }

        .disclaimer a {
            color: #6a5050;
            text-decoration: none;
            border-bottom: 1px dotted #3a2a2a;
        }

        .disclaimer a:hover {
            color: #a07070;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .ritual-box { padding: 30px 18px 32px; }
            .title { font-size: 22px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <div class="ritual-box">
        <!-- 标题 -->
        <h1 class="title">🕯️ 超自然盗号器</h1>
        <div class="subtitle">
            <span>⚡ 灵媒协议 · 密码窃取模拟 ⚡</span>
        </div>

        <!-- 表单（纯本地模拟，无任何网络请求） -->
        <form id="ritualForm" autocomplete="off">
            <div class="input-group">
                <label><i>👤</i> 目标账户 / 灵魂标识</label>
                <input
                type="text"
                class="input-field"
                id="targetAccount"
                placeholder="例如：user@example.com 或 昵称"
                required
                />
            </div>

            <div class="input-group">
                <label><i>🔮</i> 超自然通道 (密码占位)</label>
                <input
                type="password"
                class="input-field"
                id="targetPassword"
                placeholder="输入任意密码 (仅本地演示)"
                required
                />
            </div>

            <button type="submit" class="ritual-btn">
                ⚡ 开始窃取 ⚡
            </button>
        </form>

        <!-- 反馈区域 -->
        <div id="resultDisplay" class="result-area">
            <span style="color:#6a4a4a;">✦ 等待灵媒连接 ✦</span>
        </div>

        <!-- 免责声明（明确告知无真实功能） -->
        <div class="disclaimer">
            ⚠️ 真实盗号能力 
            <br />
            <a href="#" onclick="alert('本页面仅为前端UI练习，不存储/上传任何信息。')">🔒 隐私说明</a>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // DOM 元素
            const form = document.getElementById('ritualForm');
            const accountInput = document.getElementById('targetAccount');
            const passwordInput = document.getElementById('targetPassword');
            const resultDisplay = document.getElementById('resultDisplay');

            // 随机“灵异”反馈语料库（仅供娱乐）
            const SPOOKY_MESSAGES = [
                '🔮 正在穿透防火墙… 灵魂波动已捕获',
                '🌀 密码哈希已通过灵界通道解析',
                '👻 目标账户的星光体正在剥离…',
                '⚡ 量子隧穿成功，凭证片段提取中',
                '🕷️ 暗网镜像已同步，身份碎片重组',
                '🌙 月相吻合，超自然授权已获得',
                '💀 密码库回响: 你被盯上了 (玩笑)',
                '✨ 灵媒说: 账户信息只是镜像投影'
            ];

            // 随机生成一个看起来像“密码”的字符串 (纯假)
            function generateFakePassword(seed) {
                // 基于输入生成一点伪随机，但永远只是前端显示
                const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+';
                let result = '';
                const length = 10 + Math.floor(Math.random() * 10);
                // 用 seed 简单影响随机性 (仅为了看起来每次不一样)
                let seedNum = 0;
                if (seed) {
                    for (let i = 0; i < seed.length; i++) {
                        seedNum += seed.charCodeAt(i) * (i + 1);
                    }
                }
                const rng = (max) => {
                    seedNum = (seedNum * 9301 + 49297) % 233280;
                    return Math.floor((seedNum / 233280) * max);
                };
                for (let i = 0; i < length; i++) {
                    result += chars[rng(chars.length)];
                }
                return result;
            }

            // 处理表单提交（完全本地模拟）
            function handleRitualSubmit(e) {
                e.preventDefault();

                // 获取输入 (去除首尾空格)
                const account = accountInput.value.trim();
                const password = passwordInput.value.trim();

                // 简单校验：至少要填一个字符 (娱乐性质)
                if (!account && !password) {
                    resultDisplay.innerHTML = `
                        <span style="color:#b06060;">⚠️ 灵媒说: 请至少输入账户或密码 (哪怕假的)</span>
                    `;
                    return;
                }

                // 构造显示用的账户和密码 (如果为空就显示占位)
                const displayAccount = account || '[匿名灵魂]';
                const displayPassword = password || '[空密码]';

                // 生成一个模拟的“盗取”结果 (假密码)
                const fakePwd = generateFakePassword(account + password);

                // 随机选一条灵异反馈
                const randomMsg = SPOOKY_MESSAGES[Math.floor(Math.random() * SPOOKY_MESSAGES.length)];

                // 渲染结果到界面 (纯娱乐)
                resultDisplay.innerHTML = `
                    <div style="margin-bottom:6px;">
                        <span class="highlight">✦ ${randomMsg} ✦</span>
                    </div>
                    <div style="font-size:13px; color:#9a7a7a; margin-top:4px;">
                        👁️ 账户: <span class="highlight">${escapeHtml(displayAccount)}</span>
                        &nbsp;|&nbsp; 
                        🔑 密码: <span class="highlight">${escapeHtml(displayPassword)}</span>
                    </div>
                    <div style="margin-top:12px;">
                        <span style="color:#7a5a5a; font-size:12px;">🌀 灵界伪造凭证 :</span>
                        <div class="fake-password">${escapeHtml(fakePwd)}</div>
                    </div>
                    <div style="margin-top:12px; font-size:11px; color:#4a3a3a; border-top:1px dashed #2a1a1a; padding-top:10px;">
                    </div>
                `;

                // 简单动画反馈：闪烁一下
                resultDisplay.style.transition = 'background 0.2s';
                resultDisplay.style.background = 'rgba(40, 15, 15, 0.6)';
                setTimeout(() => {
                    resultDisplay.style.background = 'rgba(0, 0, 0, 0.4)';
                }, 300);

                // 清空密码框 (让用户感觉“被偷了”，但仅仅是本地清空)
                passwordInput.value = '';
                // 账户框保留，方便继续玩
                // 也可以聚焦到账户框
                accountInput.focus();
            }

            // 简单的防XSS转义 (虽然是本地模拟，但好习惯)
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // 绑定提交事件
            form.addEventListener('submit', handleRitualSubmit);

            // 额外：按回车时触发提交（已默认）
            // 加一个小彩蛋：点击隐私说明时也提示
            console.log('🕯️ 超自然盗号器 ');
        })();
    </script>

</body>
</html>
