<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>🍊 橙子被抓走 · 游戏消失了</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #1a1e2b 0%, #2a3142 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Fredoka', 'Comic Neue', system-ui, sans-serif;
      padding: 20px;
      margin: 0;
      transition: background 0.3s ease;
    }
    
    /* 游戏消失时的背景闪烁 - 修复为只触发一次，避免无限闪动 */
    body.glitch-world {
      background: #0b0c10;
      animation: bgFlicker 0.3s 2; /* 只闪烁2次，然后停止 */
    }
    
    @keyframes bgFlicker {
      0% { background: #0a0c12; }
      50% { background: #1f1f2b; }
      100% { background: #0b0c10; }
    }

    .game-container {
      background: rgba(255, 248, 235, 0.1);
      backdrop-filter: blur(18px);
      border-radius: 60px 60px 50px 50px;
      padding: 35px 30px 40px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.6), inset 0 2px 10px rgba(255,180,100,0.3);
      border: 1px solid rgba(255, 140, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      max-width: 500px;
      width: 100%;
      position: relative;
    }

    .game-container.vanished {
      opacity: 0.35;
      filter: blur(6px) contrast(1.2);
      transform: scale(0.96);
      pointer-events: none;
      border-color: rgba(200, 0, 0, 0.5);
      box-shadow: 0 0 50px rgba(255, 0, 0, 0.4);
    }

    .stage-area {
      background: #fbe9d2;
      border-radius: 80px 80px 40px 40px;
      padding: 25px 15px 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 30% 20%, #ffe5c4, #fdcb9e);
      box-shadow: inset 0 -8px 0 #cb8e5a, 0 15px 25px rgba(0,0,0,0.5);
      margin-bottom: 25px;
      transition: 0.4s;
      position: relative;
    }

    .character-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      flex-wrap: wrap;
      margin: 15px 0;
    }

    .orange-box, .monster-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 4.5rem;
      filter: drop-shadow(0 12px 10px rgba(0,0,0,0.4));
      transition: transform 0.2s, opacity 0.3s;
    }

    .orange-box span {
      font-size: 4.8rem;
      display: block;
    }

    .monster-box span {
      font-size: 5rem;
    }

    .orange-label, .monster-label {
      font-size: 1.2rem;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 4px 14px;
      border-radius: 30px;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    /* 怪兽抓走动画 */
    .monster-grab .orange-box {
      animation: grabShake 0.25s ease-in-out, fadeOutOrange 0.4s forwards 0.25s;
    }
    
    @keyframes grabShake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(12px, -8px); }
      50% { transform: translate(-14px, 5px); }
      75% { transform: translate(8px, -4px); }
      100% { transform: translate(0, 0); }
    }
    
    @keyframes fadeOutOrange {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.2) translateY(-30px); }
    }

    .story-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2d1c0c;
      background: rgba(255, 245, 215, 0.9);
      padding: 10px 25px;
      border-radius: 50px;
      margin: 10px 0 5px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
      transition: 0.3s;
      border: 2px solid #ffa74e;
    }

    .action-buttons {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 10px 0 5px;
    }

    .btn {
      background: #ffb347;
      border: none;
      background: linear-gradient(180deg, #ffb85c 0%, #ff8c1a 100%);
      color: #2d1300;
      font-weight: bold;
      font-size: 1.3rem;
      padding: 14px 28px;
      border-radius: 60px;
      box-shadow: 0 8px 0 #b85e0c, 0 12px 22px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: all 0.08s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: 2px solid #ffd58c;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 4px 0 #b85e0c, 0 10px 18px rgba(0,0,0,0.5);
      background: linear-gradient(180deg, #ff9f2f 0%, #e07b00 100%);
    }

    .btn:disabled {
      opacity: 0.6;
      transform: translateY(3px);
      box-shadow: 0 4px 0 #7b4410, 0 8px 12px rgba(0,0,0,0.4);
      pointer-events: none;
      filter: grayscale(0.2);
    }

    .reset-btn {
      background: linear-gradient(180deg, #c0c0c0 0%, #7a7a7a 100%);
      border-color: #d4d4d4;
      box-shadow: 0 8px 0 #4e4e4e, 0 12px 22px rgba(0,0,0,0.4);
      color: #1e1e1e;
    }

    .glitch-message {
      font-family: monospace;
      background: black;
      color: #ff4444;
      padding: 12px 25px;
      border-radius: 20px;
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 15px;
      text-shadow: 0 0 10px red;
      border: 2px dashed #ff0000;
      letter-spacing: 2px;
      display: none;
      text-align: center;
    }

    .visible-message {
      display: block;
    }

    @media (max-width: 450px) {
      .character-row {
        gap: 20px;
      }
      .orange-box span, .monster-box span {
        font-size: 3.8rem;
      }
      .btn {
        font-size: 1rem;
        padding: 12px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container" id="gameContainer">
    <div class="stage-area">
      <div class="character-row">
        <div class="orange-box" id="orangeBox">
          <span>🍊</span>
          <div class="orange-label">橙子</div>
        </div>
        <div class="monster-box" id="monsterBox">
          <span>👾</span>
          <div class="monster-label">怪兽</div>
        </div>
      </div>
      <div class="story-text" id="storyDisplay">🍊 橙子正在开心地玩耍</div>
    </div>

    <div class="action-buttons">
      <button class="btn" id="grabBtn">👾 怪兽抓走</button>
      <button class="btn reset-btn" id="resetBtn">🌀 重新开始</button>
    </div>

    <div class="glitch-message" id="glitchMessage">
      ⚠️ 游戏消失了 ⚠️<br> <span style="font-size:1rem;">橙子被怪兽抓走了...</span>
    </div>
  </div>

  <script>
    (function() {
      // ----- 游戏核心状态 -----
      let isOrangeGrabbed = false;   // 橙子是否已被抓
      let gameVanished = false;     // 游戏是否已消失
      let vanishTimer = null;       // 延迟消失定时器
      let isAnimating = false;      // 防止动画重复触发

      // DOM 元素
      const gameContainer = document.getElementById('gameContainer');
      const orangeBox = document.getElementById('orangeBox');
      const monsterBox = document.getElementById('monsterBox');
      const storyDisplay = document.getElementById('storyDisplay');
      const grabBtn = document.getElementById('grabBtn');
      const resetBtn = document.getElementById('resetBtn');
      const glitchMessage = document.getElementById('glitchMessage');

      // ----- 工具函数：清理所有定时器和动画状态 -----
      function clearAllTimersAndAnimations() {
        if (vanishTimer) {
          clearTimeout(vanishTimer);
          vanishTimer = null;
        }
        // 移除动画类（强制停止CSS动画）
        orangeBox.classList.remove('monster-grab');
        // 重置动画标志
        isAnimating = false;
        // 移除背景闪烁动画（通过重设body类）
        document.body.classList.remove('glitch-world');
      }

      // ----- 更新界面 -----
      function updateUI() {
        // 故事文本
        if (gameVanished) {
          storyDisplay.textContent = '❌ 游戏世界崩溃了...';
        } else if (isOrangeGrabbed) {
          storyDisplay.textContent = '😱 橙子被怪兽抓走了！';
        } else {
          storyDisplay.textContent = '🍊 橙子正在开心地玩耍';
        }

        // 故障消息显示
        if (gameVanished) {
          glitchMessage.classList.add('visible-message');
        } else {
          glitchMessage.classList.remove('visible-message');
        }

        // 容器消失效果
        if (gameVanished) {
          gameContainer.classList.add('vanished');
          // 背景闪烁只添加一次，由triggerGameVanish控制
        } else {
          gameContainer.classList.remove('vanished');
          document.body.classList.remove('glitch-world');
        }

        // 怪兽表情
        if (gameVanished) {
          monsterBox.querySelector('span').textContent = '💀';
        } else if (isOrangeGrabbed) {
          monsterBox.querySelector('span').textContent = '😈';
        } else {
          monsterBox.querySelector('span').textContent = '👾';
        }

        // 橙子可见性
        if (isOrangeGrabbed || gameVanished) {
          orangeBox.style.opacity = '0';
          orangeBox.style.pointerEvents = 'none';
        } else {
          orangeBox.style.opacity = '1';
          orangeBox.style.pointerEvents = 'auto';
        }

        // 按钮状态
        grabBtn.disabled = gameVanished;
      }

      // ----- 重置游戏 -----
      function resetGame() {
        clearAllTimersAndAnimations();
        isOrangeGrabbed = false;
        gameVanished = false;
        isAnimating = false;
        
        // 确保橙子可见且无动画残留
        orangeBox.style.opacity = '1';
        monsterBox.querySelector('span').textContent = '👾';
        document.body.classList.remove('glitch-world');
        
        updateUI();
      }

      // ----- 游戏消失（最终阶段）-----
      function triggerGameVanish() {
        // 防止重复触发
        if (gameVanished) return;
        
        // 清除定时器
        if (vanishTimer) {
          clearTimeout(vanishTimer);
          vanishTimer = null;
        }
        
        // 确保状态一致：游戏消失时橙子必须已被抓
        if (!isOrangeGrabbed) {
          isOrangeGrabbed = true;
        }
        
        gameVanished = true;
        isAnimating = false; // 动画流程结束
        
        // 添加背景闪烁效果（只播放有限次数，由CSS控制）
        document.body.classList.add('glitch-world');
        
        // 更新界面
        updateUI();
        
        console.log('💥 游戏世界消失了...');
      }

      // ----- 怪兽抓走橙子（第一阶段）-----
      function monsterGrabsOrange() {
        // 防止在动画进行中或游戏已消失时重复触发
        if (isAnimating || gameVanished || isOrangeGrabbed) {
          // 特殊情况：橙子已被抓但游戏未消失，可手动触发消失
          if (isOrangeGrabbed && !gameVanished && !isAnimating) {
            triggerGameVanish();
          }
          return;
        }

        // 设置动画锁
        isAnimating = true;
        
        // 添加抓取动画类
        orangeBox.classList.add('monster-grab');
        
        // 更新状态
        isOrangeGrabbed = true;
        updateUI();
        
        // 监听动画结束事件（只绑定一次）
        const onAnimationEnd = (e) => {
          if (e.target === orangeBox && e.animationName.includes('fadeOutOrange')) {
            // 移除监听器
            orangeBox.removeEventListener('animationend', onAnimationEnd);
            // 移除动画类
            orangeBox.classList.remove('monster-grab');
            // 释放动画锁
            isAnimating = false;
            
            // 确保橙子状态正确
            updateUI();
            
            // 设置定时器，1.8秒后游戏消失
            if (vanishTimer) clearTimeout(vanishTimer);
            vanishTimer = setTimeout(() => {
              if (isOrangeGrabbed && !gameVanished) {
                triggerGameVanish();
              }
              vanishTimer = null;
            }, 1800);
          }
        };
        
        orangeBox.addEventListener('animationend', onAnimationEnd);
      }

      // ----- 事件绑定 -----
      grabBtn.addEventListener('click', () => {
        if (gameVanished) return;
        
        if (!isOrangeGrabbed) {
          monsterGrabsOrange();
        } else if (isOrangeGrabbed && !gameVanished) {
          // 如果橙子已抓但游戏未消失，直接触发消失
          if (vanishTimer) {
            clearTimeout(vanishTimer);
            vanishTimer = null;
          }
          triggerGameVanish();
        }
      });

      resetBtn.addEventListener('click', resetGame);

      // 点击怪兽彩蛋
      monsterBox.addEventListener('click', () => {
        if (gameVanished) {
          alert('游戏已经消失了... 怪兽带着橙子逃走了。');
          return;
        }
        if (!isOrangeGrabbed && !isAnimating) {
          monsterGrabsOrange();
        } else if (isOrangeGrabbed && !gameVanished && !isAnimating) {
          if (vanishTimer) {
            clearTimeout(vanishTimer);
            vanishTimer = null;
          }
          triggerGameVanish();
        }
      });

      // 点击橙子提示
      orangeBox.addEventListener('click', (e) => {
        if (gameVanished || isOrangeGrabbed) return;
        alert('🍊 橙子：救命！怪兽在附近...');
      });

      // 初始化
      resetGame();
    })();
  </script>
</body>
</html>
