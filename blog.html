<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橙子的网站</title>
    <style>
        /* 简单加点样式，让它更好看一点 */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff3e0; /* 橙子主题的浅橙色背景 */
            font-family: "微软雅黑", sans-serif;
        }
        .text-box {
            padding: 40px 60px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff9800; /* 橙色文字，呼应橙子 */
            font-size: 28px;
            text-align: center;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="text-box">
        <h1>看什么看，没见过本橙子做网站啊</h1>
    </div>
</body>
</html>
