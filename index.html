<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>雨夜木屋 · 双鬼惊魂</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #0a0c0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      touch-action: manipulation;
      overflow: hidden;
    }
    .game-container {
      position: relative;
      box-shadow: 0 0 45px rgba(0,0,0,0.9);
      border: 3px solid #3a2e22;
      border-radius: 16px;
      overflow: hidden;
      max-width: 100%;
      background: #0f0a07;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #0a0806;
    }
    .top-hud {
      position: absolute;
      top: 12px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #f0e3ce;
      text-shadow: 2px 2px 0 #000;
      font-weight: bold;
      font-size: clamp(13px, 3.5vw, 17px);
      pointer-events: none;
      background: rgba(10, 5, 2, 0.7);
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      letter-spacing: 1px;
      border: 1px solid #5e4a38;
    }
    .message-area {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #ffeedd;
      padding: 6px 22px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
      border: 1px solid #7b6852;
      pointer-events: none;
      text-shadow: 0 0 8px black;
    }
    .intro-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #d4c0a8;
      text-align: center;
      z-index: 20;
      pointer-events: auto;
    }
    .intro-text {
      font-size: 22px;
      margin-bottom: 20px;
      text-shadow: 0 0 15px black;
      line-height: 1.5;
    }
    .start-btn {
      background: #3b2b1b;
      color: #f5e7d3;
      border: 2px solid #8b7355;
      padding: 12px 35px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .joystick-zone {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 110px;
      height: 110px;
      background: rgba(25, 18, 12, 0.6);
      border-radius: 70px;
      border: 2px solid #5e4c3b;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .joystick-thumb {
      width: 55px;
      height: 55px;
      background: #3f3122;
      border-radius: 35px;
      border: 2px solid #b89a7a;
      box-shadow: 0 4px 10px black;
      background: radial-gradient(circle at 30% 30%, #6b5a4a, #2f1f12);
    }
    .action-buttons {
      position: absolute;
      bottom: 35px;
      right: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .stairs-btn {
      background: #3b2b1b;
      color: #eedbc8;
      border: 2px solid #8b7355;
      width: 65px;
      height: 65px;
      border-radius: 40px;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 30%, #5e4a38, #2a1c10);
      box-shadow: 0 6px 10px black;
      cursor: pointer;
      touch-action: manipulation;
    }
    .restart-btn {
      position: absolute;
      bottom: 25px;
      left: 160px;
      background: #2d1f14;
      color: #dac29c;
      border: 2px solid #6b5a4a;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>
<div style="position: relative; width: 100%; max-width: 800px;">
  <div class="game-container" id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="intro-overlay" id="introOverlay">
      <div class="intro-text">雨夜，你迷失在森林…<br>躲进木屋，却发现二楼有两只鬼魂徘徊。<br>找到一楼柜子钥匙，打开二楼柜子取得大门钥匙逃离。</div>
      <button class="start-btn" id="startButton">进入木屋</button>
    </div>
    <div class="top-hud">
      <span id="floorDisplay">🏠 一楼</span>
      <span id="inventoryDisplay">📦柜锁:❌ | 🗝️大门钥匙:❌</span>
    </div>
    <div class="message-area" id="messageBox">在一楼寻找柜子钥匙…</div>
    <div class="joystick-zone" id="joystickBase">
      <div class="joystick-thumb" id="joystickThumb"></div>
    </div>
    <div class="action-buttons">
      <div class="stairs-btn" id="btnStairs">⬆️⬇️</div>
    </div>
    <button class="restart-btn" id="restartButton">↺ 重来</button>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 600;

    // 状态
    let currentFloor = 1;
    let player = { x: 400, y: 480, radius: 14, speed: 3.0 };
    let hasCabinetKey = false;
    let hasDoorKey = false;
    let gameOver = false;
    let win = false;
    let deathTimer = 0;
    let gameStarted = false;

    // 双鬼系统
    let ghosts = [
      { x: 650, y: 160, speed: 1.25, visible: true, flashCooldown: 0, flashTimer: 0, faceVariant: 0 },
      { x: 680, y: 220, speed: 1.35, visible: true, flashCooldown: 0, flashTimer: 0, faceVariant: 1 }
    ];
    const FLASH_DIST = 155;
    const FLASH_COOLDOWN = 75;
    const FLASH_DURATION = 26;

    let moveAngle = null;
    let movePower = 0;
    const keys = { w: false, a: false, s: false, d: false };

    const stairs = {
      x: 300, y: 270, w: 200, h: 70,
      floor1Pos: { x: 400, y: 500 },
      floor2Pos: { x: 400, y: 480 }
    };

    const cabinetKeyPos = { x: 200, y: 460, radius: 18, collected: false };
    const cabinetPos = { x: 580, y: 200, radius: 24, unlocked: false };
    const doorKeyInCabinet = { collected: false };
    const exitDoorPos = { x: 620, y: 520, radius: 28 };

    let audioCtx = null;
    function initAudio() {
      if (audioCtx) return;
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    function playSound(type='step', vol=0.07) {
      if (!audioCtx || audioCtx.state==='suspended') { if(audioCtx) audioCtx.resume(); else return; }
      const now = audioCtx.currentTime;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now+0.2);
      const osc = audioCtx.createOscillator();
      if(type==='step') { osc.type='square'; osc.frequency.value=75; }
      else if(type==='thunder') { osc.type='sawtooth'; osc.frequency.value=48; gain.gain.setValueAtTime(0.22,now); }
      else if(type==='jumpscare') { osc.type='sawtooth'; osc.frequency.value=240; osc.frequency.exponentialRampToValueAtTime(40,now+0.5); gain.gain.setValueAtTime(0.5,now); }
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now); osc.stop(now+0.6);
    }

    function restartGame() {
      currentFloor = 1;
      player.x = 400; player.y = 480;
      hasCabinetKey = false;
      hasDoorKey = false;
      gameOver = false;
      win = false;
      deathTimer = 0;
      cabinetKeyPos.collected = false;
      cabinetPos.unlocked = false;
      doorKeyInCabinet.collected = false;
      ghosts = [
        { x: 650, y: 160, speed: 1.25, visible: true, flashCooldown: 0, flashTimer: 0, faceVariant: 0 },
        { x: 680, y: 220, speed: 1.35, visible: true, flashCooldown: 0, flashTimer: 0, faceVariant: 1 }
      ];
      moveAngle = null; movePower = 0;
      updateUI();
      document.getElementById('messageBox').textContent = '在一楼寻找柜子钥匙…';
    }

    function startGame() {
      document.getElementById('introOverlay').style.display = 'none';
      gameStarted = true;
      initAudio();
      restartGame();
    }

    function updateUI() {
      document.getElementById('floorDisplay').textContent = currentFloor===1 ? '🏠 一楼' : '🌑 二楼';
      document.getElementById('inventoryDisplay').innerHTML = `📦柜锁:${hasCabinetKey?'✅':'❌'} | 🗝️大门钥匙:${hasDoorKey?'✅':'❌'}`;
    }

    function switchFloor() {
      if (gameOver || win) return;
      const px = player.x, py = player.y;
      if (px > stairs.x && px < stairs.x+stairs.w && py > stairs.y && py < stairs.y+stairs.h) {
        if (currentFloor === 1) {
          currentFloor = 2;
          player.x = stairs.floor2Pos.x;
          player.y = stairs.floor2Pos.y;
          document.getElementById('messageBox').textContent = '来到阴暗的二楼…两只鬼魂在游荡';
        } else {
          currentFloor = 1;
          player.x = stairs.floor1Pos.x;
          player.y = stairs.floor1Pos.y;
          document.getElementById('messageBox').textContent = '回到一楼';
          ghosts = [
            { x: 650, y: 160, speed: 1.25, visible: true, flashCooldown: 0, flashTimer: 0, faceVariant: 0 },
            { x: 680, y: 220, speed: 1.35, visible: true, flashCooldown: 0, flashTimer: 0, faceVariant: 1 }
          ];
        }
        updateUI();
        playSound('step',0.1);
      } else {
        document.getElementById('messageBox').textContent = '走到楼梯区域才能换层';
      }
    }

    function collectItems() {
      if (gameOver || win || !gameStarted) return;
      if (currentFloor === 1 && !cabinetKeyPos.collected && !hasCabinetKey) {
        if (Math.hypot(player.x-cabinetKeyPos.x, player.y-cabinetKeyPos.y) < cabinetKeyPos.radius+player.radius) {
          cabinetKeyPos.collected = true;
          hasCabinetKey = true;
          document.getElementById('messageBox').textContent = '获得柜子钥匙！去二楼打开柜子';
          updateUI();
        }
      }
      if (currentFloor === 2 && hasCabinetKey && !cabinetPos.unlocked) {
        if (Math.hypot(player.x-cabinetPos.x, player.y-cabinetPos.y) < cabinetPos.radius+player.radius) {
          cabinetPos.unlocked = true;
          doorKeyInCabinet.collected = true;
          hasDoorKey = true;
          document.getElementById('messageBox').textContent = '打开柜子！发现大门钥匙！快回一楼';
          updateUI();
        }
      }
    }

    function checkExit() {
      if (gameOver || win || !hasDoorKey || currentFloor!==1) return;
      if (Math.hypot(player.x-exitDoorPos.x, player.y-exitDoorPos.y) < exitDoorPos.radius+player.radius) {
        win = true;
        document.getElementById('messageBox').textContent = '你逃出了木屋！';
      }
    }

    function updateGhosts() {
      if (!gameStarted || gameOver || win) return;
      if (currentFloor !== 2) {
        ghosts.forEach(g => g.visible = false);
        return;
      }
      ghosts.forEach(g => {
        g.visible = true;
        if (g.flashCooldown > 0) g.flashCooldown--;
        if (g.flashTimer > 0) { g.flashTimer--; if(g.flashTimer===0) g.visible=true; }

        const dx = player.x - g.x;
        const dy = player.y - g.y;
        const dist = Math.hypot(dx, dy);
        if (g.visible && g.flashTimer<=0) {
          g.x += Math.cos(Math.atan2(dy,dx)) * g.speed;
          g.y += Math.sin(Math.atan2(dy,dx)) * g.speed;
        }
        if (dist < FLASH_DIST && g.flashCooldown<=0 && g.flashTimer<=0 && g.visible) {
          g.visible=false; g.flashTimer=FLASH_DURATION; g.flashCooldown=FLASH_COOLDOWN;
          const ang = Math.atan2(dy,dx);
          g.x = player.x + Math.cos(ang)*42; g.y = player.y + Math.sin(ang)*42;
          playSound('thunder',0.16);
        }
        if (g.visible && dist < player.radius+18) triggerDeath();
      });
    }

    function triggerDeath() {
      if (gameOver||win) return;
      gameOver=true; deathTimer=72;
      playSound('jumpscare',0.6);
      document.getElementById('messageBox').textContent='被鬼抓住了...';
    }

    function movePlayer() {
      if (!gameStarted || gameOver||win) return;
      let dx=0,dy=0;
      if (movePower>0.2 && moveAngle!==null) { dx=Math.cos(moveAngle)*movePower; dy=Math.sin(moveAngle)*movePower; }
      else { if(keys.w)dy-=1; if(keys.s)dy+=1; if(keys.a)dx-=1; if(keys.d)dx+=1; }
      if(dx!==0||dy!==0){ const l=Math.hypot(dx,dy); player.x+=(dx/l)*player.speed; player.y+=(dy/l)*player.speed; if(Math.random()<0.12)playSound('step',0.05); }
      player.x=Math.min(Math.max(player.x,30),W-30);
      player.y=Math.min(Math.max(player.y,75),H-35);
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      drawBackground();

      if(currentFloor===1) {
        drawFirstFloor();
        if(!gameOver||deathTimer<=0) drawPlayer();
      } else {
        drawSecondFloor();
        if(!gameOver||deathTimer<=0) drawPlayer();
        ghosts.forEach(g => { if(g.visible && !gameOver) drawGhost(g); });
        // 纯黑视野
        ctx.save();
        ctx.fillStyle='#000000';
        ctx.beginPath();
        ctx.rect(0,0,W,H);
        ctx.arc(player.x, player.y, 105, 0, Math.PI*2);
        ctx.fill('evenodd');
        ctx.restore();
      }

      if(gameOver&&deathTimer>0){ drawJumpscare(); deathTimer--; }
      if(win){ ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#f0e6c5'; ctx.font='36px Courier'; ctx.fillText('逃脱成功',W/2,H/2); }
      drawRain();
    }

    function drawBackground() {
      const grad=ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#0e0703'); grad.addColorStop(0.8,'#1a1008');
      ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
    }
    function drawFirstFloor() {
      ctx.fillStyle='#1a1008'; ctx.fillRect(30,340,740,230);
      ctx.strokeStyle='#4a3a2a'; ctx.strokeRect(30,340,740,230);
      ctx.fillStyle='#332214'; ctx.fillRect(stairs.x, stairs.y, stairs.w, stairs.h);
      ctx.fillStyle='#c9b896'; ctx.font='bold 16px Courier'; ctx.fillText('⬆️ 二楼', stairs.x+60, stairs.y+45);
      if(!cabinetKeyPos.collected){
        ctx.fillStyle='#c9a96b'; ctx.beginPath(); ctx.arc(cabinetKeyPos.x,cabinetKeyPos.y,12,0,2*Math.PI); ctx.fill();
        ctx.fillText('🔑',cabinetKeyPos.x-15,cabinetKeyPos.y+5);
      }
      ctx.fillStyle='#2e1c10'; ctx.fillRect(exitDoorPos.x-25,exitDoorPos.y-35,50,70);
      ctx.fillText('🚪',exitDoorPos.x-18,exitDoorPos.y+8);
    }
    function drawSecondFloor() {
      ctx.fillStyle='#0f0a05'; ctx.fillRect(30,60,740,220);
      ctx.strokeStyle='#332214'; ctx.strokeRect(30,60,740,220);
      ctx.fillStyle='#332214'; ctx.fillRect(stairs.x, stairs.y-80, stairs.w, stairs.h);
      ctx.fillText('⬇️ 一楼', stairs.x+60, stairs.y-35);
      ctx.fillStyle='#3d2818'; ctx.fillRect(cabinetPos.x-25,cabinetPos.y-32,50,64);
      ctx.fillStyle='#1f1008'; ctx.fillRect(cabinetPos.x-20,cabinetPos.y-28,40,56);
      ctx.fillText(cabinetPos.unlocked?'📭':'🗄️',cabinetPos.x-22,cabinetPos.y+6);
    }
    function drawPlayer() {
      ctx.save(); ctx.translate(player.x,player.y);
      ctx.fillStyle='#f5e7d3'; ctx.shadowColor='#ffcc88'; ctx.shadowBlur=15;
      ctx.beginPath(); ctx.arc(0,0,player.radius,0,2*Math.PI); ctx.fill();
      ctx.fillStyle='#2c2416'; ctx.font='18px Courier'; ctx.fillText('🧑',-12,7);
      ctx.restore();
    }
    function drawGhost(g) {
      ctx.save(); ctx.translate(g.x, g.y);
      const flicker = 0.6 + Math.sin(Date.now()*0.03 + g.faceVariant)*0.25;
      ctx.fillStyle = `rgba(155, 185, 205, ${flicker})`;
      ctx.shadowColor = '#992222';
      ctx.shadowBlur = 28;
      ctx.beginPath(); ctx.ellipse(0,0,19,25,0,0,2*Math.PI); ctx.fill();
      ctx.fillStyle = '#0a0000';
      ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(-7,-8,5.5,0,Math.PI,true); ctx.fill();
      ctx.beginPath(); ctx.arc(7,-8,5.5,0,Math.PI,true); ctx.fill();
      ctx.fillStyle = '#ff2222';
      ctx.beginPath(); ctx.arc(-7,-10,2.2,0,2*Math.PI); ctx.fill();
      ctx.beginPath(); ctx.arc(7,-10,2.2,0,2*Math.PI); ctx.fill();
      ctx.strokeStyle = '#440000';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(0,9,8,0.2,Math.PI-0.2); ctx.stroke();
      ctx.fillStyle = '#550000';
      ctx.beginPath(); ctx.arc(0,11,3.5,0,Math.PI); ctx.fill();
      ctx.restore();
    }
    function drawJumpscare() {
      ctx.fillStyle='#000000'; ctx.fillRect(0,0,W,H);
      ctx.save(); ctx.translate(W/2, H/2-20);
      ctx.fillStyle='#aac0d8'; ctx.shadowColor='#cc0000'; ctx.shadowBlur=65;
      ctx.beginPath(); ctx.ellipse(0,0,80,100,0,0,2*Math.PI); ctx.fill();
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(-28,-24,14,0,Math.PI,true); ctx.fill(); ctx.arc(28,-24,14,0,Math.PI,true); ctx.fill();
      ctx.fillStyle='#ff0000'; ctx.arc(-28,-27,5,0,2*Math.PI); ctx.fill(); ctx.arc(28,-27,5,0,2*Math.PI); ctx.fill();
      ctx.strokeStyle='#600'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(0,30,22,0.2,Math.PI-0.2); ctx.stroke();
      ctx.restore();
    }
    function drawRain() {
      ctx.strokeStyle='rgba(150,180,210,0.4)'; ctx.lineWidth=1;
      for(let i=0;i<95;i++){ let x=(i*24+Date.now()*0.35)%W; let y=(i*13)%H; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-2,y+12); ctx.stroke(); }
    }

    // 摇杆
    const joystickBase=document.getElementById('joystickBase');
    const joystickThumb=document.getElementById('joystickThumb');
    let active=false;
    function startJ(e){ e.preventDefault(); active=true; initAudio(); }
    function moveJ(e){
      if(!active)return; e.preventDefault();
      const touch=e.touches?e.touches[0]:e;
      const rect=joystickBase.getBoundingClientRect();
      const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
      let dx=touch.clientX-cx, dy=touch.clientY-cy;
      const dist=Math.hypot(dx,dy), max=45;
      if(dist>max){ dx=(dx/dist)*max; dy=(dy/dist)*max; }
      joystickThumb.style.transform=`translate(${dx}px,${dy}px)`;
      movePower=Math.min(dist/max,1); moveAngle=Math.atan2(dy,dx);
    }
    function endJ(){ active=false; joystickThumb.style.transform='translate(0,0)'; movePower=0; moveAngle=null; }
    joystickBase.addEventListener('touchstart',startJ); joystickBase.addEventListener('touchmove',moveJ); joystickBase.addEventListener('touchend',endJ);
    joystickBase.addEventListener('mousedown',startJ); window.addEventListener('mousemove',(e)=>{if(active)moveJ(e)}); window.addEventListener('mouseup',endJ);

    document.getElementById('btnStairs').addEventListener('click', ()=>{ initAudio(); switchFloor(); });
    document.getElementById('restartButton').addEventListener('click', restartGame);
    document.getElementById('startButton').addEventListener('click', startGame);

    window.addEventListener('keydown', e=>{
      const k=e.key.toLowerCase();
      if(k==='w'||k==='arrowup'){keys.w=true;e.preventDefault();}
      if(k==='s'||k==='arrowdown'){keys.s=true;e.preventDefault();}
      if(k==='a'||k==='arrowleft'){keys.a=true;e.preventDefault();}
      if(k==='d'||k==='arrowright'){keys.d=true;e.preventDefault();}
      initAudio();
    });
    window.addEventListener('keyup', e=>{
      if(e.key.toLowerCase()==='w'||e.key==='ArrowUp')keys.w=false;
      if(e.key.toLowerCase()==='s'||e.key==='ArrowDown')keys.s=false;
      if(e.key.toLowerCase()==='a'||e.key==='ArrowLeft')keys.a=false;
      if(e.key.toLowerCase()==='d'||e.key==='ArrowRight')keys.d=false;
    });

    function loop() {
      if(gameStarted && !gameOver && !win) { movePlayer(); collectItems(); checkExit(); updateGhosts(); }
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  })();
</script>
</body>
</html>
